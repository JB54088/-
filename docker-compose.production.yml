name: customer-assets

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      ALIYUN_ECS_ADDR: ${ALIYUN_ECS_ADDR:-}
      ALIYUN_RDS_URL: ${ALIYUN_RDS_URL:-}
      ALIYUN_RDS_PORT: ${ALIYUN_RDS_PORT:-5432}
      ALIYUN_RDS_DB_NAME: ${ALIYUN_RDS_DB_NAME:-}
      ALIYUN_RDS_USERNAME: ${ALIYUN_RDS_USERNAME:-}
      ALIYUN_RDS_PWD: ${ALIYUN_RDS_PWD:-}
      ALIYUN_RDS_CA_FILE: ${ALIYUN_RDS_CA_FILE:-}
      ALIYUN_RDS_SSL_MODE: ${ALIYUN_RDS_SSL_MODE:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY: ${ALIYUN_ACCESS_KEY:-}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION:-oss-cn-beijing}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_INTERNAL: ${OSS_INTERNAL:-false}
      OSS_PREFIX: ${OSS_PREFIX:-abc-imports}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in env file}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      CORS_ORIGINS: ${APP_ORIGIN:-${CORS_ORIGINS:-http://127.0.0.1:8080}}
      INITIAL_ADMIN01_PASSWORD: ${INITIAL_ADMIN01_PASSWORD:-Admin01@123}
      INITIAL_ADMIN02_PASSWORD: ${INITIAL_ADMIN02_PASSWORD:-Admin02@123}
      INITIAL_SALES01_PASSWORD: ${INITIAL_SALES01_PASSWORD:-Sales01@123}
      INITIAL_SALES02_PASSWORD: ${INITIAL_SALES02_PASSWORD:-Sales02@123}
      INITIAL_SALES03_PASSWORD: ${INITIAL_SALES03_PASSWORD:-Sales03@123}
      EXCEL_MAX_FILE_SIZE_MB: ${EXCEL_MAX_FILE_SIZE_MB:-20}
      EXCEL_MAX_ROWS: ${EXCEL_MAX_ROWS:-50000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-business-analysis-mock}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/certs:/app/certs:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      NODE_ENV: production
      TZ: Asia/Shanghai
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 60s

  proxy:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PROXY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:80"]
    profiles: ["quick-tunnel"]
    depends_on:
      proxy:
        condition: service_healthy
