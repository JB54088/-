# Image tags used when amd64 images are built on a workstation and transferred
# to an ECS host that cannot reach Docker Hub. Build contexts from the base
# production file remain available, but deploy with --no-build and --pull never.
services:
  db:
    image: customer-assets-postgres:ecs-amd64
  backend:
    image: customer-assets-backend:ecs-amd64
  frontend:
    image: customer-assets-frontend:ecs-amd64
  proxy:
    image: customer-assets-nginx:ecs-amd64
  cloudflared:
    image: customer-assets-cloudflared:ecs-amd64
